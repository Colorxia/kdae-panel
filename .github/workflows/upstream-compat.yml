name: kdae 上游兼容

on:
  workflow_dispatch:
  schedule:
    # 每天验一次：发布命名、.dgst 格式、Actions 接口与命令行为都在上游手里，
    # 改了不会有人通知我们，只能自己勤查。
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: kdae-upstream-compat
  cancel-in-progress: true

jobs:
  # 版本发现契约独立成一个 job，不搭在构建之后。
  # 挂在"构建 kdae"后面的话，上游一旦构建坏掉，这个检查就完全不跑——而它恰恰是
  # 唯一能发现"上游改了打包方式，面板一个版本都装不上"的地方。
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出面板
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      # 版本发现与 geo 数据都依赖上游的资产命名与校验和格式，这些都在面板之外，
      # 只有对真实上游跑一遍才能发现它们变了。
      - name: 验证版本发现与 geo 数据契约
        env:
          KDAE_UPSTREAM_LIVE: '1'
          # 匿名调用 GitHub API 是每出口 IP 每小时 60 次，而 runner 的出口 IP
          # 是共享的。这一步一次要打四路上游加面板自身，此前常因额度耗尽而失败——
          # 报的是限流，看起来却像上游契约破了。Actions 自带的 token 有每小时
          # 1000 次，只读公开仓库足够，且 permissions 已限定 contents: read。
          KDAE_PANEL_GITHUB_TOKEN: ${{ github.token }}
        # 两个包都要跑：upstream 验证上游的资产命名与校验和格式，
        # geodata 验证取到之后的落盘与回滚。只列前者的话，后者等于没写。
        run: go test -count=1 -run '^TestLive' -timeout=12m ./internal/upstream ./internal/geodata

  # 面板与 dae 分离运行，从不编译 dae；它管理的是用户实际安装的发布包。所以契约
  # 对发布包验证：取官方与 kdae 最新可安装的构建，经面板安装 dae 时的同一条下载与
  # 校验路径，用包内的二进制、Geo 数据与 example.dae 跑 validate、outline 与 sysdump。
  #
  # 这里曾经检出 kdae 源码、装 clang/llvm 再全量编译。那测的不是用户运行的东西，
  # 还把上游构建环境的问题引了进来，并丢掉了发布包自带的 Geo 数据——dae 的 validate
  # 开始加载 Geo 之后，这项检查从 2026-09-14 起连续失败了六周。
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出面板
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: 验证面板与 dae 发布包的公开契约
        env:
          KDAE_UPSTREAM_LIVE: '1'
          KDAE_PANEL_GITHUB_TOKEN: ${{ github.token }}
        run: go test -count=1 -v -run '^TestUpstreamContract$' -timeout=10m ./internal/dae
